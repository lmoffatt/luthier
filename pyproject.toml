[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luthier"
version = "0.3.0"
description = "Luthier: a language of tested types, rebuilt from its theories (the v0.1 interpreter is at the tag v0.1-final)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
luthier = "luthier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luthier = ["lib/*.lth", "lib/*.lut", "lib/core/*.lut", "lib/core/**/*.lth", "lib/core/**/*.lut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
